[package]
name = "eqviewer"
version = "0.1.1"
license = "MIT"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eqviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "net"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
tauri-plugin-notification = "2.7.0"
image = { version = "0.25.10", default-features = false, features = ["gif"] }
tauri-plugin-single-instance = "2.5.4"
roxmltree = "0.21.1"
tauri-plugin-window-state = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
