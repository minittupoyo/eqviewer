name: Build

# 手動実行のみ(Actions タブの "Run workflow" から)
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust_targets: ""
            tauri_args: --bundles nsis
            bundle_dir: src-tauri/target/release/bundle/nsis
          - name: macos
            os: macos-latest
            # Apple Silicon と Intel の両方で動くユニバーサルバイナリにする
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles dmg
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle/dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # フロントエンドの型チェックとテスト
      - run: bun run build
      - run: bun run test

      # 署名はしない。配布物は未署名のインストーラ/ディスクイメージ
      - run: bun run tauri build ${{ matrix.tauri_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: EQViewer-${{ matrix.name }}
          path: ${{ matrix.bundle_dir }}/*
          if-no-files-found: error
